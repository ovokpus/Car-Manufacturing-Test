[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greener"
version = "1.0.0"
description = "Predict Mercedes-Benz test-bench time from a vehicle configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.4",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "xgboost==2.1.4",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]
ui = [
    "streamlit==1.66.1",
]

[project.scripts]
greener-train = "greener.train:main"

[tool.setuptools]
packages = ["greener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
